name: Verificar projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-e-estilo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar verificador de estilo
        run: python -m pip install flake8

      - name: Executar testes
        run: python -m unittest -v

      - name: Verificar estilo
        run: python -m flake8

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t inventario-verificacao .
      - name: Iniciar e consultar aplicação
        run: |
          docker run -d --name inventario-verificacao -p 8080:8080 inventario-verificacao
          for tentativa in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/saude; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/riscos
          test "$(docker inspect -f '{{.State.Running}}' inventario-verificacao)" = true
          docker logs inventario-verificacao
