name: Verificar projeto

on:
  push:
  pull_request:

jobs:
  testes-e-estilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install flake8
      - run: python -m unittest -q test_sprint2.py test_risco.py
      - run: python -m flake8 .
