name: Verificar projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes-e-estilo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt flake8

      - name: Executar testes
        run: python app.py --testes

      - name: Verificar estilo
        run: |
          python -m flake8
          python -m black --check .

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t inventario-ci:2217 .

      - name: Validar configuração Compose
        run: docker compose config --quiet

      - name: Testar serviço e porta 2217
        run: |
          set -e
          printf '%s' 'senha-dedicada-para-testes' > /tmp/inventario-ci-senha
          chmod 644 /tmp/inventario-ci-senha
          docker run -d --name inventario-ci -p 127.0.0.1:2217:2217 -e INVENTARIO_PORTA=2217 -e INVENTARIO_SENHA_ARQUIVO=/run/secrets/senha -v /tmp/inventario-ci-senha:/run/secrets/senha:ro inventario-ci:2217
          trap 'docker rm -f inventario-ci || true; rm -f /tmp/inventario-ci-senha' EXIT
          for tentativa in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:2217/saude > /tmp/saude.json; then
              break
            fi
            sleep 1
          done
          python3 -c "import json; d=json.load(open('/tmp/saude.json')); assert d['estado']=='ativo'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2217/riscos)" = 401
          curl --fail --silent -H 'Authorization: Bearer senha-dedicada-para-testes' http://127.0.0.1:2217/riscos > /tmp/riscos.json
          curl --fail --silent -H 'Authorization: Bearer senha-dedicada-para-testes' 'http://127.0.0.1:2217/v1/ativos?limite=2&ordenar=risco' > /tmp/ativos-v1.json
          python3 -c "import json; d=json.load(open('/tmp/ativos-v1.json', encoding='utf8')); assert len(d['itens']) == 2 and d['total'] >= 2"
          curl --fail --silent http://127.0.0.1:2217/openapi.json > /tmp/openapi.json
          python3 -c "import json; d=json.load(open('/tmp/openapi.json', encoding='utf8')); assert '/v1/ativos' in d['paths']"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2217/admin)" = 404
          docker exec inventario-ci python -c "from apresentacao.interface_rica import InterfaceRica; print('interface: OK')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2217/rota-teste-auditoria)" = 404
          docker exec inventario-ci python -c "import json; p='/app/dados/auditoria-acessos.jsonl'; e=json.loads(open(p, encoding='utf-8').readlines()[-1]); assert e['rota']=='/rota-teste-auditoria' and e['codigo_http']==404"

  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python Windows
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes de regressão no Windows
        run: python app.py --testes

      - name: Validar BAT incluindo instalacao automatica
        shell: cmd
        run: |
          call iniciar.bat --testes
